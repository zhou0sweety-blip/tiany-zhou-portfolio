<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>404 · Page Not Found | SWEETY ZHOU</title>
<link rel="icon" href="/assets/logo-studio.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080808; --text:#F5F5F5; --muted:#8A8A8A; --line:#1D1D1D; --k-flame:#FF5B1F;
    --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:6vw;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:620px}
  .code{
    font-size:clamp(56px,13vw,116px); font-weight:600; letter-spacing:-.045em;
    line-height:.9; color:var(--k-flame);
  }
  h1{
    margin-top:22px; font-size:clamp(20px,3.4vw,30px); font-weight:500;
    letter-spacing:-.02em; line-height:1.3;
  }
  p{margin-top:16px; font-size:15px; line-height:1.7; color:var(--muted); max-width:44ch}
  .rule{height:1px;background:var(--line);margin:30px 0}
  a.back{
    display:inline-flex; align-items:center; gap:10px;
    font-size:12px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
    color:var(--text); text-decoration:none;
    border-bottom:1px solid var(--k-flame); padding-bottom:6px;
    transition:color .3s ease, border-color .3s ease;
  }
  a.back:hover{color:var(--k-flame)}
  .brand{
    margin-top:44px; font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p>The link may be broken, or the page may have been moved. You&rsquo;ll be taken back to the portfolio home in a few seconds.</p>
    <div class="rule"></div>
    <a class="back" href="/">← Back to portfolio</a>
    <div class="brand">Sweety Zhou &middot; Visual Designer</div>
  </div>
  <script>
    setTimeout(function(){ location.replace('/'); }, 4000);
  </script>
</body>
</html>
